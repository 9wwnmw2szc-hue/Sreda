name: Visual audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/app/globals.css"
      - "src/components/**"
      - "scripts/ui-audit-capture.mjs"
      - "scripts/visual-polish-capture.mjs"
      - "scripts/responsive-audit.mjs"
      - "e2e/ui-system.spec.mjs"
      - ".github/workflows/visual-audit.yml"
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots (throwaway account)
        id: capture
        env:
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL }}
          AUDIT_OUTPUT: artifacts/visual-audit
          AUDIT_PHASE: staging
          # Optional override; when unset the script registers a throwaway user.
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
        run: |
          set -euo pipefail
          export AUDIT_BASE_URL="${AUDIT_BASE_URL:-https://web-production-1aace.up.railway.app}"
          node scripts/ui-audit-capture.mjs
          PNG_COUNT=$(find artifacts/visual-audit -name '*.png' | wc -l | tr -d ' ')
          echo "png_count=${PNG_COUNT}" >> "$GITHUB_OUTPUT"
          if [ ! -f artifacts/visual-audit/report.json ]; then
            echo "Missing report.json" >&2
            exit 1
          fi
          if [ "$PNG_COUNT" -lt 1 ]; then
            echo "No PNG screenshots were written" >&2
            exit 1
          fi
          echo "Captured ${PNG_COUNT} PNGs"
      - name: Upload visual artifacts
        if: always() && steps.capture.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: soty-visual-audit-${{ github.sha }}
          path: artifacts/visual-audit/
          retention-days: 21
          if-no-files-found: error
