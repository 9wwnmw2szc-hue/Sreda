name: Visual audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/app/globals.css"
      - "src/components/**"
      - "scripts/visual-polish-capture.mjs"
      - "scripts/ui-polish-capture.mjs"
      - ".github/workflows/visual-audit.yml"
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Check audit credentials
        id: creds
        env:
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
        run: |
          if [ -z "$AUDIT_USER" ] || [ -z "$AUDIT_PASS" ]; then
            echo "Missing AUDIT_USER / AUDIT_PASS secrets — skipping authenticated captures."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Capture screenshots
        if: steps.creds.outputs.skip != 'true'
        env:
          AUDIT_USER: ${{ secrets.AUDIT_USER }}
          AUDIT_PASS: ${{ secrets.AUDIT_PASS }}
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL }}
          AUDIT_OUTPUT: artifacts/visual-audit
        run: |
          export AUDIT_BASE_URL="${AUDIT_BASE_URL:-https://web-production-1aace.up.railway.app}"
          node scripts/visual-polish-capture.mjs
      - name: Upload visual artifacts
        if: steps.creds.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: soty-visual-audit-${{ github.sha }}
          path: artifacts/visual-audit/
          retention-days: 21
          if-no-files-found: warn
