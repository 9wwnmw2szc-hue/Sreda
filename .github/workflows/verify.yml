name: Verify
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sreda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sreda:ci-only-password@localhost:5432/sreda_test
      NEXT_PUBLIC_DATA_SOURCE: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:http
      - name: Build deployment image and check worker imports
        run: |
          docker build -t sreda-ci .
          docker run --rm --entrypoint node sreda-ci --import tsx --input-type=module -e 'await Promise.all([import("./src/server/telegram/service.ts"), import("./src/server/vk/service.ts"), import("./src/server/booking/service.ts"), import("./src/server/posts/service.ts"), import("./src/server/solutions/service.ts")]);'

  ui-gate:
    name: UI gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve audit base URL
        id: base
        env:
          AUDIT_BASE_URL_VAR: ${{ vars.AUDIT_BASE_URL }}
        run: |
          echo "url=${AUDIT_BASE_URL_VAR:-https://web-production-1aace.up.railway.app}" >> "$GITHUB_OUTPUT"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright ui-system (Chromium)
        env:
          E2E_BASE_URL: ${{ steps.base.outputs.url }}
          AUDIT_BASE_URL: ${{ steps.base.outputs.url }}
        run: npx playwright test e2e/ui-system.spec.mjs --project=chromium
      - name: Playwright ui-system (WebKit)
        env:
          E2E_BASE_URL: ${{ steps.base.outputs.url }}
          AUDIT_BASE_URL: ${{ steps.base.outputs.url }}
        run: npx playwright test e2e/ui-system.spec.mjs --project=webkit
      - name: Playwright contrast computed styles
        env:
          E2E_BASE_URL: ${{ steps.base.outputs.url }}
          AUDIT_BASE_URL: ${{ steps.base.outputs.url }}
        run: npx playwright test e2e/contrast-computed.spec.mjs --project=chromium
      - name: Prepare auth storage for responsive audit
        id: auth
        env:
          AUDIT_BASE_URL: ${{ steps.base.outputs.url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          import { writeFile, mkdir } from "node:fs/promises";
          const base = process.env.AUDIT_BASE_URL;
          await mkdir("artifacts", { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const ctx = await browser.newContext();
          const page = await ctx.newPage();
          const suffix = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
          const user = `uigat${suffix}`.slice(0, 28);
          const pass = "AcceptTest!2026ui";
          const res = await page.goto(base + "/register", { waitUntil: "networkidle", timeout: 90000 });
          if (!res || res.status() >= 500) {
            throw new Error(`NETWORK_UNAVAILABLE: register ${res?.status()}`);
          }
          await page.locator("#account-login").waitFor({ state: "visible", timeout: 30000 });
          await page.waitForTimeout(1500);
          await page.locator("#account-login").click();
          await page.locator("#account-login").pressSequentially(user, { delay: 15 });
          await page.locator("#account-password").fill(pass);
          await page.locator("#account-confirmation").fill(pass);
          await page.getByRole("button", { name: /создать аккаунт/i }).click();
          const checkbox = page.locator("label.recovery-confirm input[type=checkbox]");
          await checkbox.waitFor({ state: "attached", timeout: 45000 });
          await page.locator("label.recovery-confirm").click();
          await page.getByRole("button", { name: /продолжить/i }).click();
          await page.waitForFunction(() => !location.pathname.includes("/register"), null, { timeout: 45000 });
          if (page.url().includes("business/new")) {
            const name = page.locator("#business-name");
            await name.waitFor({ state: "visible", timeout: 20000 });
            await page.waitForTimeout(800);
            await name.click();
            await name.fill("");
            await name.pressSequentially(`UI Gate ${suffix}`, { delay: 15 });
            const createPromise = page.waitForResponse(
              (r) => r.url().includes("/api/v1/businesses") && r.request().method() === "POST",
              { timeout: 60000 },
            );
            await page.getByRole("button", { name: /создать пространство/i }).click();
            const createRes = await createPromise.catch(() => null);
            if (createRes && !createRes.ok()) {
              throw new Error(`PRODUCT_REGRESSION: create business HTTP ${createRes.status()}`);
            }
            await page.waitForFunction(
              () => !location.pathname.includes("/business/new"),
              null,
              { timeout: 60000 },
            );
          }
          await writeFile("artifacts/audit-storage.json", JSON.stringify(await ctx.storageState(), null, 2));
          await browser.close();
          console.log("storage written");
          JS
      - name: Responsive audit (authenticated)
        env:
          AUDIT_BASE_URL: ${{ steps.base.outputs.url }}
          AUDIT_STORAGE_STATE: artifacts/audit-storage.json
          AUDIT_OUTPUT: artifacts/responsive-audit
        run: |
          mkdir -p artifacts/responsive-audit
          npm run audit:responsive
      - name: Upload UI gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soty-ui-gate-${{ github.sha }}
          path: |
            artifacts/responsive-audit/
            artifacts/audit-storage.json
          retention-days: 14
          if-no-files-found: warn
