name: Verify
on:
  push:
    branches: ["codex/accounts-workspaces"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sreda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sreda:ci-only-password@localhost:5432/sreda_test
      NEXT_PUBLIC_DATA_SOURCE: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
