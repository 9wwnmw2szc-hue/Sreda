name: Verify
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sreda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sreda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sreda -d sreda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sreda:ci-only-password@localhost:5432/sreda_test
      NEXT_PUBLIC_DATA_SOURCE: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:http
      - name: Build deployment image and check worker imports
        run: |
          docker build -t sreda-ci .
          docker run --rm --entrypoint node sreda-ci --import tsx --input-type=module -e 'await Promise.all([import("./src/server/telegram/service.ts"), import("./src/server/vk/service.ts"), import("./src/server/booking/service.ts"), import("./src/server/posts/service.ts"), import("./src/server/solutions/service.ts")]);'
